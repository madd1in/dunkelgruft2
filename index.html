<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DUNKELGRUFT — Dungeon Crawler</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Pirata+One&family=IM+Fell+English:ital@0;1&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;background:#040406;overflow:hidden;font-family:'IM Fell English',Georgia,serif;color:#d8c9a3}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:radial-gradient(ellipse at 50% 60%, #0a0b10 0%, #030304 80%)}
#frame{position:relative;width:1024px;height:576px;flex:none;box-shadow:0 0 90px rgba(255,140,40,.07),0 0 30px #000;transform-origin:center center}
canvas#game{display:block;width:1024px;height:576px;image-rendering:pixelated;background:#000;cursor:crosshair}
/* ---------- HUD ---------- */
#hud{position:absolute;inset:0;pointer-events:none;text-shadow:0 2px 4px #000}
.panel{background:rgba(8,9,13,.62);border:1px solid #5c4d2e;box-shadow:inset 0 0 14px rgba(0,0,0,.8)}
#topleft{position:absolute;left:16px;top:14px;padding:10px 12px;border-radius:3px}
#hpwrap{position:relative;width:210px;height:16px;background:#101218;border:1px solid #6b5b3a;box-shadow:inset 0 2px 6px #000}
#hpbar{position:absolute;left:0;top:0;bottom:0;width:100%;background:linear-gradient(180deg,#c0392b,#7e1d18 60%,#5c120e);transition:width .18s ease-out;box-shadow:0 0 8px rgba(192,57,43,.55)}
#hptext{position:absolute;right:6px;top:-1px;font-family:'Pirata One';font-size:14px;color:#f2e3c2;letter-spacing:1px}
#hplabel{font-family:'Pirata One';font-size:12px;letter-spacing:3px;color:#8f7f5c;margin-bottom:3px}
#icons{display:flex;align-items:center;gap:14px;margin-top:8px;font-family:'Pirata One';font-size:17px;color:#e5d5a8}
#icons svg{width:19px;height:19px;vertical-align:-3px;margin-right:3px;filter:drop-shadow(0 0 3px rgba(0,0,0,.9))}
#torchWrap{display:none;align-items:center;gap:5px}
#torchBar{width:44px;height:6px;background:#101218;border:1px solid #6b5b3a;position:relative}
#torchBar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#ff8c1e,#ffd27a)}
#compass{position:absolute;left:50%;top:12px;transform:translateX(-50%)}
#topright{position:absolute;right:16px;top:14px;padding:7px;border-radius:3px;text-align:center}
#mini{display:block;image-rendering:pixelated}
#miniLabel{font-family:'Pirata One';font-size:11px;letter-spacing:2px;color:#8f7f5c;margin-top:4px}
#depth{position:absolute;left:18px;bottom:14px;font-family:'Pirata One'}
#depth b{display:block;font-size:26px;letter-spacing:4px;color:#e8d7ac;text-shadow:0 0 12px rgba(255,150,50,.35),0 2px 4px #000}
#depth span{font-size:14px;letter-spacing:2px;color:#9c8a61;font-style:italic}
#hint{position:absolute;right:18px;bottom:14px;font-size:13px;color:#77694d;letter-spacing:1px;font-style:italic}
#msgs{position:absolute;left:50%;top:24%;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:4px;width:70%}
.toast{font-family:'Pirata One';font-size:21px;letter-spacing:2px;color:#f0dfb4;text-shadow:0 0 10px rgba(255,160,60,.4),0 2px 5px #000;animation:toast 2.8s forwards}
.toast.bad{color:#ff8f7a}
.toast.good{color:#a8e6c8}
@keyframes toast{0%{opacity:0;transform:translateY(10px)}12%{opacity:1;transform:translateY(0)}78%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
#levelcard{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;opacity:0;pointer-events:none}
#levelcard.show{animation:card 3s forwards}
#levelcard h2{font-family:'Pirata One';font-size:52px;letter-spacing:10px;color:#ecd9a8;text-shadow:0 0 24px rgba(255,150,50,.5),0 3px 8px #000}
#levelcard p{font-size:19px;font-style:italic;color:#9c8a61;margin-top:8px;letter-spacing:2px}
@keyframes card{0%{opacity:0}18%{opacity:1}75%{opacity:1}100%{opacity:0}}
/* ---------- Overlays ---------- */
#dmgflash{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px 55px rgba(160,10,5,.85);opacity:0}
#vig{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at 50% 52%,transparent 46%,rgba(0,0,0,.82) 100%)}
#frame.dying #vig{animation:pulseRed 1.1s infinite}
@keyframes pulseRed{0%,100%{box-shadow:inset 0 0 90px 20px rgba(140,0,0,0)}50%{box-shadow:inset 0 0 120px 40px rgba(150,10,5,.5)}}
#scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(0deg,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);opacity:.5}
#fade{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
#fade.blood{background:radial-gradient(ellipse at center,#2a0302,#000 75%)}
#overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(3,4,7,.78);z-index:40}
#overlay.hidden{display:none}
.card{max-width:640px;text-align:center;padding:40px 50px;background:linear-gradient(180deg,rgba(14,13,11,.92),rgba(7,7,9,.94));border:1px solid #5c4d2e;box-shadow:0 0 60px rgba(0,0,0,.9),inset 0 0 40px rgba(0,0,0,.6);position:relative}
.card::before,.card::after{content:"";position:absolute;width:14px;height:14px;border:1px solid #8a744a}
.card::before{left:8px;top:8px;border-right:none;border-bottom:none}
.card::after{right:8px;bottom:8px;border-left:none;border-top:none}
h1.title{font-family:'Pirata One';font-size:74px;letter-spacing:9px;color:#e8d2a0;line-height:1;text-shadow:0 0 30px rgba(255,140,40,.45),0 0 6px rgba(255,90,20,.5),0 4px 10px #000;animation:flick 3.4s infinite}
@keyframes flick{0%,100%{opacity:1}92%{opacity:1}93%{opacity:.82}94%{opacity:1}97%{opacity:.9}98%{opacity:1}}
.sub{font-style:italic;color:#93805a;font-size:18px;margin:12px 0 26px;letter-spacing:1px}
.ctrl{display:grid;grid-template-columns:auto auto;gap:7px 18px;justify-content:center;font-size:15px;color:#b3a179;margin-bottom:28px;text-align:left}
kbd{font-family:'IM Fell English';background:#1b1d24;border:1px solid #55503c;border-bottom-width:3px;border-radius:3px;padding:1px 9px;color:#e8d7ac;font-size:13px;margin-right:2px}
button.go{font-family:'Pirata One';font-size:27px;letter-spacing:5px;color:#f3e2b8;background:linear-gradient(180deg,#3a2f1c,#241d10);border:1px solid #8a744a;padding:12px 44px;cursor:pointer;text-shadow:0 0 10px rgba(255,160,60,.4);transition:.15s}
button.go:hover{background:linear-gradient(180deg,#54431f,#332711);box-shadow:0 0 24px rgba(255,150,50,.35);transform:translateY(-1px)}
.best{margin-top:20px;font-size:14px;color:#6f6146;letter-spacing:2px}
h1.dead{font-family:'Pirata One';font-size:64px;letter-spacing:12px;color:#c0392b;text-shadow:0 0 34px rgba(190,20,10,.6),0 3px 8px #000}
.stats{display:flex;gap:34px;justify-content:center;margin:22px 0 28px;font-family:'Pirata One'}
.stats div{font-size:14px;letter-spacing:2px;color:#8f7f5c}
.stats b{display:block;font-size:34px;color:#e8d7ac}
.flameL,.flameR{position:absolute;top:34%;width:60px;height:120px;pointer-events:none;filter:blur(1px)}
.flameL{left:16%}.flameR{right:16%}
.flameL::before,.flameR::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 50% 70%,rgba(255,150,40,.5),rgba(255,90,10,.18) 45%,transparent 70%);animation:flick 1.9s infinite}
.pauseTxt{font-family:'Pirata One';font-size:38px;letter-spacing:8px;color:#d8c9a3;cursor:pointer;text-shadow:0 0 18px rgba(255,150,50,.4)}
.pauseSub{color:#8f7f5c;font-style:italic;margin-top:12px}
</style>
</head>
<body>
<div id="stage">
<div id="frame">
<canvas id="game" width="512" height="288"></canvas>
<div id="hud">
<div id="topleft" class="panel">
<div id="hplabel">LEBEN</div>
<div id="hpwrap"><div id="hpbar"></div><span id="hptext">100</span></div>
<div id="icons">
<span><svg viewBox="0 0 24 24"><circle cx="8" cy="8" r="4.2" fill="none" stroke="#d9b64e" stroke-width="2.4"/><path d="M11 11 L20 20 M17.4 17.4 l3 -0.8 M14.8 14.8 l2.4 -0.7" stroke="#d9b64e" stroke-width="2.4" fill="none" stroke-linecap="round"/></svg><span id="keyCt">0</span></span>
<span><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8" fill="#d9a83e" stroke="#8a6420" stroke-width="2"/><circle cx="12" cy="12" r="4" fill="none" stroke="#8a6420" stroke-width="1.6"/></svg><span id="goldCt">0</span></span>
<span id="torchWrap"><svg viewBox="0 0 24 24"><rect x="10.6" y="9" width="2.8" height="12" rx="1" fill="#7c5b39"/><path d="M12 2c2.6 2.2 3.4 4.4 .6 6.8C9.8 6.4 9.4 4.2 12 2z" fill="#ff9a2e"/></svg><span id="torchBar"><i></i></span></span>
</div>
</div>
<canvas id="compass" width="240" height="30"></canvas>
<div id="topright" class="panel"><canvas id="mini" width="136" height="136"></canvas><div id="miniLabel">KARTE · M</div></div>
<div id="depth"><b id="depthLvl">EBENE I</b><span id="depthName">Die Schwelle</span></div>
<div id="hint">WASD bewegen · Maus umsehen · Klick/Leertaste Schlag · M Karte</div>
<div id="msgs"></div>
<div id="levelcard"><h2></h2><p></p></div>
</div>
<div id="scan"></div>
<div id="vig"></div>
<div id="dmgflash"></div>
<div id="fade"></div>
</div>
</div>
<div id="overlay"></div>

<script>
"use strict";
/* ================= UTILS ================= */
const clamp=(v,a,b)=>v<a?a:v>b?b:v, lerp=(a,b,t)=>a+(b-a)*t;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function hash2(x,y){let h=(x*374761393+y*668265263)|0;h=Math.imul(h^(h>>>13),1274126177);return((h^(h>>>16))>>>0)/4294967296}
function wrapAng(a){a=(a+Math.PI)%(2*Math.PI);if(a<0)a+=2*Math.PI;return a-Math.PI}
function roman(n){const P=[[20,'XX'],[19,'XIX'],[18,'XVIII'],[17,'XVII'],[16,'XVI'],[15,'XV'],[14,'XIV'],[13,'XIII'],[12,'XII'],[11,'XI'],[10,'X'],[9,'IX'],[8,'VIII'],[7,'VII'],[6,'VI'],[5,'V'],[4,'IV'],[3,'III'],[2,'II'],[1,'I']];let s='';for(const[v,r]of P)while(n>=v){s+=r;n-=v}return s||'I'}
const $=id=>document.getElementById(id);

/* ================= KONSTANTEN ================= */
const VW=512, VH=288, TEX=64, NSH=26, FOV=0.72;
const NAMES=["Die Schwelle","Modrige Gänge","Knochengalerie","Die Gruftkammern","Halle der Asche","Der Schwarze Schacht","Abgrund der Namenlosen","Das Grab ohne Boden"];
const cv=$('game'), ctx=cv.getContext('2d',{alpha:false});
ctx.imageSmoothingEnabled=false;
const img=ctx.createImageData(VW,VH), buf32=new Uint32Array(img.data.buffer);
const zbuf=new Float32Array(VW);
const BLACK=(255<<24|10<<16|8<<8|6)>>>0;
buf32.fill(BLACK);

/* Resize / Letterbox */
const frame=$('frame');
function resize(){const s=Math.min(innerWidth/1024,innerHeight/576);frame.style.transform=`scale(${s})`;}
addEventListener('resize',resize);resize();

/* ================= TEXTUREN ================= */
function packU32(r,g,b){return((255<<24)|(clamp(b|0,0,255)<<16)|(clamp(g|0,0,255)<<8)|clamp(r|0,0,255))>>>0}
function texStone(mossy,rune,seed){
const a=new Uint32Array(4096),R=mulberry32(seed);
const cracks=[];for(let k=0;k<5;k++){let x=(R()*64)|0,y=(R()*64)|0;const p=[];for(let s=0;s<11;s++){p.push([x&63,y&63]);x+=(R()*3|0)-1;y+=(R()*3|0)-1}cracks.push(p)}
for(let y=0;y<64;y++)for(let x=0;x<64;x++){
const row=y>>3,off=(row&1)*8,bx=(x+off)&15;
const mortar=(y&7)===0||bx===0;
const bid=(((x+off)>>4)*31+row*17)|0;
let v=0.72+0.5*hash2(bid,row*3+1); v*=0.8+0.4*hash2(x,y);
let r=56*v,g=60*v,b=72*v;
if(mortar){r=15;g=17;b=23}
if(mossy){const m=hash2(x>>2,y>>2);if(m>0.58&&!mortar){const k=Math.min(1,(m-0.58)*3.4);r=lerp(r,52,k);g=lerp(g,84,k);b=lerp(b,44,k)}}
a[y*64+x]=packU32(r,g,b);
}
for(const p of cracks)for(const[x,y]of p){const i=y*64+x;const v=a[i];const r=(v&255)*0.45,g=((v>>>8)&255)*0.45,b=((v>>>16)&255)*0.45;a[i]=packU32(r,g,b)}
if(rune){
const G=["0111110","0100000","0111100","0100100","0100100","0100010","0100001"];
for(let gy=0;gy<7;gy++)for(let gx=0;gx<7;gx++){
if(G[gy][gx]==='1'){const px=18+gx*4,py=18+gy*4;
for(let dy=0;dy<4;dy++)for(let dx=0;dx<4;dx++){
const d=Math.max(Math.abs(dx-1.5),Math.abs(dy-1.5));
const i=(py+dy)*64+(px+dx);
if(d<1.1)a[i]=packU32(150,255,235);
else{const v=a[i];a[i]=packU32((v&255)*0.5+40,((v>>>8)&255)*0.5+90,((v>>>16)&255)*0.5+85)}
}}}
}
return a;
}
function texWood(locked){
const a=new Uint32Array(4096);
for(let y=0;y<64;y++)for(let x=0;x<64;x++){
const plank=(x/11)|0;
const band=(y>=10&&y<=14)||(y>=46&&y<=50);
let r,g,b;
if(band){r=44;g=46;b=52;if((x%16)===5&&((y===12)||(y===48))){r=96;g=100;b=110}}
else{let v=0.78+0.4*hash2(plank*7,(y>>2))+0.16*hash2(x,y);if(locked)v*=0.72;r=84*v;g=58*v;b=36*v;if(x%11===0){r*=0.4;g*=0.4;b*=0.4}}
a[y*64+x]=packU32(r,g,b);
}
if(locked){for(let y=26;y<40;y++)for(let x=26;x<38;x++){
const dx=x-32,dy=y-33;
if(Math.abs(dx)<=5&&Math.abs(dy)<=6){let c=packU32(178,142,54);
if((Math.abs(dx)<=1&&dy>=-2)||(dy<=-2&&dx*dx+dy*dy<10))c=packU32(24,20,12);
if(Math.abs(dx)===5||Math.abs(dy)===6)c=packU32(120,92,32);
a[y*64+x]=c}}}
else{for(let t=0;t<40;t++){const an=t/40*Math.PI*2;const x=(32+Math.cos(an)*6)|0,y=(34+Math.sin(an)*6)|0;if(x>=0&&x<64&&y>=0&&y<64)a[y*64+x]=packU32(90,94,104)}}
return a;
}
function texFloor(){
const a=new Uint32Array(4096);
for(let y=0;y<64;y++)for(let x=0;x<64;x++){
const tx=x&15,ty=y&15,tile=((x>>4)*5+(y>>4)*13);
const grout=tx===0||ty===0;
let v=0.75+0.45*hash2(tile,3)+0.3*hash2(x,y);
let r=52*v,g=50*v,b=47*v;
if(grout){r=17;g=17;b=19}
if(hash2(x*3,y*3)>0.965){r*=1.4;g*=1.4;b*=1.35}
a[y*64+x]=packU32(r,g,b);
}
return a;
}
function texCeil(){
const a=new Uint32Array(4096);
for(let y=0;y<64;y++)for(let x=0;x<64;x++){
let v=0.7+0.6*hash2(x,y)*hash2(x>>2,y>>2);
const crack=hash2(x>>1,y>>1)>0.93?0.45:1;
a[y*64+x]=packU32(27*v*crack,28*v*crack,34*v*crack);
}
return a;
}
function buildShades(tex){
const out=[];
for(let s=0;s<NSH;s++){
const l=Math.pow(s/(NSH-1),1.18),a=new Uint32Array(4096);
for(let i=0;i<4096;i++){
const v=tex[i];
const r=(v&255)*l, g=((v>>>8)&255)*0.93*l, b=((v>>>16)&255)*0.8*l;
a[i]=packU32(r,g,b);
}
out.push(a);
}
return out;
}
const SH={
1:buildShades(texStone(false,false,3)),
2:buildShades(texStone(true,false,7)),
3:buildShades(texStone(false,true,13)),
4:buildShades(texWood(false)),
5:buildShades(texWood(true)),
};
const FLOOR_SH=buildShades(texFloor()), CEIL_SH=buildShades(texCeil());

/* ================= SPRITE-BILDER ================= */
function mkCanvas(draw,w=64,h=64){const c=document.createElement('canvas');c.width=w;c.height=h;const g=c.getContext('2d');draw(g);return c}
function glow(g,c,b){g.shadowColor=c;g.shadowBlur=b}
function shadow(g){g.fillStyle='rgba(0,0,0,.5)';g.beginPath();g.ellipse(32,60,13,3.6,0,0,7);g.fill()}
const IMGS={};
IMGS.skel=mkCanvas(g=>{
shadow(g);g.lineCap='round';
g.fillStyle='#1e2028';g.beginPath();g.moveTo(20,61);g.lineTo(25,37);g.lineTo(39,37);g.lineTo(44,61);
g.lineTo(40,58);g.lineTo(37,62);g.lineTo(33,58);g.lineTo(29,62);g.lineTo(25,58);g.closePath();g.fill();
g.strokeStyle='#cfc4a8';g.lineWidth=2.6;
g.beginPath();g.moveTo(32,38);g.lineTo(32,24);g.stroke();
g.lineWidth=2.2;
for(const y of[28,32,36]){g.beginPath();g.arc(32,y,6,0.15,Math.PI-0.15);g.stroke()}
g.strokeStyle='#c4b998';g.lineWidth=2.4;
g.beginPath();g.moveTo(26,26);g.lineTo(18,40);g.moveTo(38,26);g.lineTo(46,34);g.stroke();
g.strokeStyle='#7d7263';g.lineWidth=2;g.beginPath();g.moveTo(46,34);g.lineTo(55,18);g.stroke();
g.fillStyle='#d9d0b6';g.beginPath();g.arc(32,17,8,0,7);g.fill();
g.fillRect(28,23,8,4);
glow(g,'#ff2d20',7);g.fillStyle='#ff4130';
g.beginPath();g.arc(29,16,1.9,0,7);g.arc(35,16,1.9,0,7);g.fill();
g.shadowBlur=0;g.fillStyle='#2a2620';g.fillRect(29,24,1.6,3);g.fillRect(31.6,24,1.6,3);g.fillRect(34,24,1.6,3);
});
IMGS.wisp=mkCanvas(g=>{
const rg=g.createRadialGradient(32,26,2,32,26,18);
rg.addColorStop(0,'#ffffff');rg.addColorStop(0.35,'#9be8ff');rg.addColorStop(1,'rgba(50,140,255,0)');
glow(g,'#6fd8ff',14);g.fillStyle=rg;g.beginPath();g.arc(32,26,18,0,7);g.fill();
g.shadowBlur=0;
const tr=[[30,44,3.4,.5],[34,51,2.4,.3],[29,57,1.7,.18]];
for(const[x,y,r,a]of tr){g.fillStyle=`rgba(120,215,255,${a})`;g.beginPath();g.arc(x,y,r,0,7);g.fill()}
});
IMGS.demon=mkCanvas(g=>{
shadow(g);g.lineCap='round';
g.fillStyle='#33100c';g.fillRect(24,50,7,11);g.fillRect(34,50,7,11);
const rg=g.createRadialGradient(32,34,4,32,38,20);
rg.addColorStop(0,'#77271d');rg.addColorStop(1,'#330f0b');
g.fillStyle=rg;g.beginPath();g.ellipse(32,38,13.5,16,0,0,7);g.fill();
g.strokeStyle='#4a1712';g.lineWidth=5;
g.beginPath();g.moveTo(20,30);g.lineTo(12,42);g.moveTo(44,30);g.lineTo(52,42);g.stroke();
glow(g,'#ff7a26',5);g.strokeStyle='#ff7a26';g.lineWidth=1.6;
g.beginPath();g.moveTo(29,30);g.lineTo(32.5,38);g.lineTo(30.5,46);g.stroke();
g.fillStyle='#4a1712';g.beginPath();g.arc(32,15,9,0,7);g.fill();
g.strokeStyle='#d9cdb4';g.lineWidth=3;
g.beginPath();g.moveTo(25,9);g.quadraticCurveTo(19,5,18,-1);g.moveTo(39,9);g.quadraticCurveTo(45,5,46,-1);g.stroke();
glow(g,'#ffb347',7);g.fillStyle='#ffb347';
g.beginPath();g.arc(28.4,14,2,0,7);g.arc(35.6,14,2,0,7);g.fill();
g.shadowBlur=0;g.fillStyle='#1a0806';g.fillRect(27,20,10,3);
g.fillStyle='#e8dcc0';for(let i=0;i<4;i++)g.fillRect(28+i*2.4,20,1.3,2);
});
IMGS.potion=mkCanvas(g=>{

let AC=null,master=null,noiseBuf=null;
function initAudio(){
if(AC)return;
try{
AC=new (window.AudioContext||window.webkitAudioContext)();
master=AC.createGain();master.gain.value=0.5;master.connect(AC.destination);
noiseBuf=AC.createBuffer(1,AC.sampleRate,AC.sampleRate);
const d=noiseBuf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
// Ambient-Drone
const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=150;lp.Q.value=0.8;
const dg=AC.createGain();dg.gain.value=0.05;
for(const f of[54,54.7]){const o=AC.createOscillator();o.type='sawtooth';o.frequency.value=f;o.connect(lp);o.start()}
const lfo=AC.createOscillator(),lg=AC.createGain();lfo.frequency.value=0.09;lg.gain.value=45;lfo.connect(lg);lg.connect(lp.frequency);lfo.start();
lp.connect(dg);dg.connect(master);
const wn=AC.createBufferSource();wn.buffer=noiseBuf;wn.loop=true;
const wf=AC.createBiquadFilter();wf.type='lowpass';wf.frequency.value=320;
const wg=AC.createGain();wg.gain.value=0.014;wn.connect(wf);wf.connect(wg);wg.connect(master);wn.start();
dripLoop();
}catch(e){AC=null}
}
function dripLoop(){
if(!AC)return;
setTimeout(()=>{if(AC&&state!=='title'){beep(1250+Math.random()*400,800,0.09,'sine',0.045);beep(900,600,0.12,'sine',0.02,0.14)}dripLoop()},5000+Math.random()*9000);
}
function beep(f0,f1,d,type='sine',v=0.2,dl=0){
if(!AC)return;const t=AC.currentTime+dl;
const o=AC.createOscillator(),g=AC.createGain();
o.type=type;o.frequency.setValueAtTime(f0,t);o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+d);
g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
o.connect(g);g.connect(master);o.start(t);o.stop(t+d+0.03);
}
function nz(d,v=0.3,f=800,f1=null,ft='bandpass',dl=0){
if(!AC)return;const t=AC.currentTime+dl;
const n=AC.createBufferSource();n.buffer=noiseBuf;
const f_=AC.createBiquadFilter();f_.type=ft;f_.frequency.setValueAtTime(f,t);
if(f1)f_.frequency.exponentialRampToValueAtTime(f1,t+d);
f_.Q.value=1;
const g=AC.createGain();g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
n.connect(f_);f_.connect(g);g.connect(master);n.start(t);n.stop(t+d+0.03);
}

let state='title', paused=false;

let MW=24,MH=24,grid=null,visited=null,doorAnims=new Map(),sprites=[];
let stairsCell=-1, startCell=0, lockedThisLevel=false;
let px=2,py=2,ang=0,dirX=1,dirY=0,planeX=0,planeY=FOV;

let bobPhase=0,bobPix=0,lastStepSign=0,speedNow=0;

/* ================= LEVEL-GENERIERUNG ================= */
function bfs(sx,sy,blockCell){
const dist=new Int32Array(MW*MH).fill(-1),par=new Int32Array(MW*MH).fill(-1);
const q=[sy*MW+sx];dist[q[0]]=0;let head=0;
while(head<q.length){
const c=q[head++],cx=c%MW,cy=(c/MW)|0;
for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
const nx=cx+dx,ny=cy+dy;
if(nx<0||ny<0||nx>=MW||ny>=MH)continue;
const n=ny*MW+nx;
if(n===blockCell)continue;
if(grid[n]!==0)continue;
if(dist[n]===-1){dist[n]=dist[c]+1;par[n]=c;q.push(n)}
}
}
return{dist,par};
}
function isCorridor(i,needOpen=0){
const x=i%MW,y=(i/MW)|0;
const o=[grid[y*MW+x-1]===needOpen||true,0];
const l=grid[y*MW+x-1]===0,r=grid[y*MW+x+1]===0,u=grid[(y-1)*MW+x]===0,d=grid[(y+1)*MW+x]===0;
const n=[l,r,u,d].filter(v=>v).length;
return n===2&&((l&&r)||(u&&d));
}
function genLevel(d){
rng=mulberry32(seedBase+d*7919);
MW=MH=Math.min(24+d*2,34);
grid=new Uint8Array(MW*MH).fill(1);
visited=new Uint8Array(MW*MH);
doorAnims.clear();sprites=[];
let cx=MW>>1,cy=MH>>1;
startCell=cy*MW+cx;
const target=MW*MH*0.33;let carved=0,guard=0;
while(carved<target&&guard++<60000){
if(grid[cy*MW+cx]===1){grid[cy*MW+cx]=0;carved++}
const dir=(rng()*4)|0;
cx=clamp(cx+[1,-1,0,0][dir],1,MW-2);cy=clamp(cy+[0,0,1,-1][dir],1,MH-2);
if(rng()<0.055){
const rw=1+((rng()*2)|0),rh=1+((rng()*2)|0);
for(let y=cy-rh;y<=cy+rh;y++)for(let x=cx-rw;x<=cx+rw;x++)
if(x>0&&y>0&&x<MW-1&&y<MH-1&&grid[y*MW+x]===1){grid[y*MW+x]=0;carved++}
}
}
for(let i=0;i<MW*MH;i++)if(grid[i]===1){const r=rng();grid[i]=r<0.15?2:r<0.2?3:1}
// Treppe = entfernteste Zelle
const b0=bfs(cx,cy,-1);
let far=0;for(let i=0;i<MW*MH;i++)if(b0.dist[i]>b0.dist[far])far=i;
stairsCell=far;
// Pfad rekonstruieren
const path=[];let c=far;while(c!==-1){path.push(c);c=b0.par[c]}
// Versiegelte Tür (ab Ebene 2)
lockedThisLevel=false;let lockCell=-1,keyCell=-1;
if(d>=2){
for(let k=(path.length*0.62)|0;k>path.length*0.18;k--){
const pc=path[k];
if(pc===far||pc===startCell)continue;
if(isCorridor(pc)){lockCell=pc;break}
}
if(lockCell>=0){
grid[lockCell]=5;lockedThisLevel=true;
const b1=bfs(cx,cy,lockCell);
let kf=0;for(let i=0;i<MW*MH;i++)if(b1.dist[i]>b1.dist[kf]&&grid[i]===0)kf=i;
keyCell=kf;
// Schatz hinter der Tür
const b2=bfs(far%MW,(far/MW)|0,lockCell);
const behind=[];for(let i=0;i<MW*MH;i++)if(b2.dist[i]>2&&grid[i]===0)behind.push(i);
for(let k=0;k<2&&behind.length;k++){
const cell=behind[(rng()*behind.length)|0];
sprites.push({kind:'pick',ptype:'gold',x:cell%MW+0.5,y:(cell/MW|0)+0.5,phase:rng()*7,val:10+(rng()*15|0)});
}
}
}
// Normale Holztüren
const reach=bfs(cx,cy,lockCell);
let doorsPlaced=0,wantDoors=Math.min(1+(d>>1),4);
for(let tries=0;tries<300&&doorsPlaced<wantDoors;tries++){
const i=(rng()*MW*MH)|0;
if(grid[i]!==0||reach.dist[i]<5||i===far||i===keyCell)continue;
if(isCorridor(i)){grid[i]=4;doorsPlaced++}
}
// Wandfackeln
let torchCount=0;
for(let i=0;i<MW*MH&&torchCount<15;i++){
if(grid[i]===0&&rng()<0.045){
const x=i%MW,y=(i/MW)|0;
for(const[dx,dy]of[[1,0],[-1,0],[0,1],[0,-1]]){
if(grid[(y+dy)*MW+x+dx]>0){
sprites.push({kind:'torch',x:x+0.5+dx*0.42,y:y+0.5+dy*0.42,phase:rng()*7});
torchCount++;break;
}
}
}
}
// Portal
sprites.push({kind:'portal',x:far%MW+0.5,y:(far/MW|0)+0.5,phase:0});
// Schlüssel
if(keyCell>=0)sprites.push({kind:'pick',ptype:'key',x:keyCell%MW+0.5,y:(keyCell/MW|0)+0.5,phase:0});
// Gegner
const nEn=Math.min(3+d*2,15),hm=1+0.18*(d-1);
const ET={skel:{hp:34,dmg:12,spd:1.55,sc:0.82,fl:0},wisp:{hp:16,dmg:7,spd:2.5,sc:0.5,fl:0.34},demon:{hp:95,dmg:22,spd:1.0,sc:0.98,fl:0}};
const cand=[];for(let i=0;i<MW*MH;i++)if(reach.dist[i]>=7&&grid[i]===0&&i!==keyCell)cand.push(i);
for(let k=0;k<nEn&&cand.length;k++){
const cell=cand.splice((rng()*cand.length)|0,1)[0];
const r=rng();
let et='skel';
if(d>=2&&r<0.1+0.05*d)et='demon';else if(r<0.5)et='wisp';
const s=ET[et];
sprites.push({kind:'enemy',etype:et,x:cell%MW+0.5,y:(cell/MW|0)+0.5,
hp:Math.round(s.hp*hm),maxHp:Math.round(s.hp*hm),dmg:Math.round(s.dmg*hm),spd:s.spd*(1+0.04*(d-1)),
sc:s.sc,fl:s.fl,wake:false,atkCd:0,windup:0,flash:0,deadT:-1,phase:rng()*7});
}
// Pickups
const pCand=[];for(let i=0;i<MW*MH;i++)if(reach.dist[i]>=4&&grid[i]===0&&i!==keyCell&&i!==far)pCand.push(i);
const put=(ptype,n,val)=>{for(let k=0;k<n&&pCand.length;k++){const cell=pCand.splice((rng()*pCand.length)|0,1)[0];
sprites.push({kind:'pick',ptype,x:cell%MW+0.5,y:(cell/MW|0)+0.5,phase:rng()*7,val:val||0})}};
put('potion',2+(rng()<0.5?1:0));
put('gold',3+d);
put('torch',1+(rng()<0.4?1:0));
// Spielerposition
px=cx+0.5;py=cy+0.5;
for(const[dx,dy]of[[1,0],[0,1],[-1,0],[0,-1]])
if(grid[(cy+dy)*MW+cx+dx]===0){ang=Math.atan2(dy,dx);break}
}

/* ================= KOLLISION & TÜREN ================= */
function solidCell(cx,cy){
if(cx<0||cy<0||cx>=MW||cy>=MH)return true;
const c=grid[cy*MW+cx];
if(c===0)return false;
if(c===4||c===5){const da=doorAnims.get(cy*MW+cx);if(da!==undefined&&da>0.55)return false;return true}
return true;
}
function blockedCircle(x,y,r){
return solidCell((x-r)|0,(y-r)|0)||solidCell((x+r)|0,(y-r)|0)||solidCell((x-r)|0,(y+r)|0)||solidCell((x+r)|0,(y+r)|0);
}
function tryMove(o,dx,dy,r){
const hits=[];
const nx=o.x+dx,ny=o.y+dy;
if(!blockedCircle(nx,o.y,r))o.x=nx;
else{
const s=Math.sign(dx)||1;
const cx=((nx+s*(r+0.02))|0),cy=(o.y|0);
hits.push(cy*MW+cx);
}
if(!blockedCircle(o.x,ny,r))o.y=ny;
else{
const s=Math.sign(dy)||1;
const cx=(o.x|0),cy=((ny+s*(r+0.02))|0);
hits.push(cy*MW+cx);
}
return hits;
}
function openDoor(i){
if(doorAnims.has(i))return;
doorAnims.set(i,0.0001);sfx.door();
}
function bumpDoor(i){
if(i<0||i>=MW*MH)return;
const c=grid[i];
if(c===4)openDoor(i);
else if(c===5){
if(keys>0){keys--;openDoor(i);sfx.unlock();msg('Das Schloss springt auf.','good')}
else if(timeNow>lockMsgCd){lockMsgCd=timeNow+1.2;sfx.thud();msg('Verschlossen — du brauchst einen Schlüssel.','bad')}
}
}
function los(x0,y0,x1,y1){
const dx=x1-x0,dy=y1-y0,d=Math.hypot(dx,dy),steps=Math.ceil(d/0.15);
for(let i=1;i<steps;i++){
const x=x0+dx*i/steps,y=y0+dy*i/steps;
const c=grid[(y|0)*MW+(x|0)];
if(c!==0&&c!==undefined)return false;
}
return true;
}

function shadeIdx(d,extra){let i=(lightAt(d)*(NSH-1))|0;i+=extra||0;return clamp(i,0,NSH-1)}

/* ================= KAMPF ================= */
function doAttack(){
if(attackCd>0||state!=='play'||paused)return;
attackCd=0.42;attackT=0.3;hitPending=true;sfx.swing();
for(const s of sprites)if(s.kind==='enemy'&&s.deadT<0){
const d=Math.hypot(s.x-px,s.y-py);
if(d<5)s.wake=true;
}
}
function resolveHit(){
let any=false;
for(const s of sprites){
if(s.kind!=='enemy'||s.deadT>=0)continue;
const dx=s.x-px,dy=s.y-py,d=Math.hypot(dx,dy);
if(d>1.85)continue;
const da=Math.abs(wrapAng(Math.atan2(dy,dx)-ang));
if(da>0.75)continue;
any=true;
const dmg=18+Math.random()*8;
s.hp-=dmg;s.flash=0.14;s.wake=true;
const kx=dx/d*0.3,ky=dy/d*0.3;
const tmp={x:s.x,y:s.y};tryMove(tmp,kx,ky,0.25);s.x=tmp.x;s.y=tmp.y;
if(s.hp<=0){
s.deadT=0;kills++;sfx.kill();
if(Math.random()<0.4)sprites.push({kind:'pick',ptype:'gold',x:s.x,y:s.y,phase:Math.random()*7,val:4+(Math.random()*10|0)});
}
}
if(any){sfx.hit();shakeMag=Math.max(shakeMag,2.2);hitStop=0.045}else shakeMag=Math.max(shakeMag,0.8);
}

/* ================= UPDATE ================= */
function update(dt){
timeNow+=dt;
flick=0.93+0.045*Math.sin(timeNow*9.7)+0.025*Math.sin(timeNow*23.3+1.7);
torchPower=torchT>0?1.65:1.0;
if(torchT>0)torchT-=dt;
if(attackCd>0)attackCd-=dt;
if(hurtCd>0)hurtCd-=dt;
if(attackT>0){
attackT-=dt;
if(hitPending&&attackT<0.19){hitPending=false;resolveHit()}
}
if(state==='title'){ang+=dt*0.1;return}
if(state!=='play')return;
// Bewegung
const k=keysDown;
let fwd=(k.KeyW||k.ArrowUp?1:0)-(k.KeyS||k.ArrowDown?1:0);
let str=(k.KeyD?1:0)-(k.KeyA?1:0);
if(k.ArrowRight)ang+=2.6*dt;
if(k.ArrowLeft)ang-=2.6*dt;
dirX=Math.cos(ang);dirY=Math.sin(ang);
planeX=-dirY*FOV;planeY=dirX*FOV;
let mx=dirX*fwd+(-dirY)*str, my=dirY*fwd+dirX*str;
const ml=Math.hypot(mx,my);
speedNow=0;
if(ml>0.01){
mx/=ml;my/=ml;
const sp=3.1;speedNow=sp;
const hits=tryMove({get x(){return px},set x(v){px=v},get y(){return py},set y(v){py=v}},mx*sp*dt,my*sp*dt,0.22);
// Hack: tryMove braucht Objekt – direkt:
}
// (sauberer:) eigene Bewegung
// -> bereits oben; Tür-Interaktion separat:
if(ml>0.01){
const ox=px,oy=py;
const nx=px+mx*3.1*dt,ny=py+my*3.1*dt;
if(!blockedCircle(nx,py,0.22))px=nx;else bumpDoor(((py|0)*MW+((nx+(Math.sign(mx)||1)*0.24))|0));
if(!blockedCircle(px,ny,0.22))py=ny;else bumpDoor((((ny+(Math.sign(my)||1)*0.24))|0)*MW+(px|0)));
}
// Bob & Schritte
if(ml>0.01){
bobPhase+=dt*10;
const s=Math.sin(bobPhase);
if(lastStepSign<0&&s>=0){nz(0.05,0.07,300+Math.random()*120,null,'lowpass')}
lastStepSign=s;
bobPix=s*3;
}else bobPix*=0.85;
// Sichtfeld markieren
const pcx=px|0,pcy=py|0;
for(let dy=-2;dy<=2;dy++)for(let dx=-2;dx<=2;dx++){
if(dx*dx+dy*dy>5.5)continue;
const x=pcx+dx,y=pcy+dy;
if(x>=0&&y>=0&&x<MW&&y<MH)visited[y*MW+x]=1;
}
// Türen animieren
for(const[i,t]of doorAnims){
const nt=t+dt*2.4;
if(nt>=1){grid[i]=0;doorAnims.delete(i)}else doorAnims.set(i,nt);
}
// Gegner
for(const s of sprites){
if(s.kind!=='enemy')continue;
if(s.deadT>=0){s.deadT+=dt;continue}
if(s.flash>0)s.flash-=dt;
if(s.atkCd>0)s.atkCd-=dt;
const dx=px-s.x,dy=py-s.y,d=Math.hypot(dx,dy);
if(!s.wake&&d<7.5&&los(s.x,s.y,px,py)){s.wake=true;sfx.aggro()}
if(s.wake){
if(d>0.78){
const wob=Math.sin(timeNow*3+s.phase)*0.3;
let vx=dx/d,vy=dy/d;
const rx=-vy,ry=vx;
vx+=rx*wob*0.4;vy+=ry*wob*0.4;
const vl=Math.hypot(vx,vy);vx/=vl;vy/=vl;
const before={x:s.x,y:s.y};
const hits=tryMove(s,vx*s.spd*dt,vy*s.spd*dt,0.27);
if(s.x===before.x&&s.y===before.y){const h=hits[0];if(h!==undefined)bumpDoor(h)}
for(const h of hits)if(grid[h]===4)bumpDoor(h);
}else if(s.atkCd<=0&&s.windup<=0)s.windup=0.38;
}
if(s.windup>0){
s.windup-=dt;
if(s.windup<=0){s.atkCd=1.15;if(d<1.2)hurtPlayer(s.dmg)}
}
}
// Separation
const en=sprites.filter(s=>s.kind==='enemy'&&s.deadT<0);
for(let i=0;i<en.length;i++)for(let j=i+1;j<en.length;j++){
const a=en[i],b=en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy);
if(d<0.55&&d>0.001){const p=(0.55-d)/2;a.x-=dx/d*p;a.y-=dy/d*p;b.x+=dx/d*p;b.y+=dy/d*p}
}
sprites=sprites.filter(s=>!(s.kind==='enemy'&&s.deadT>0.7));
// Pickups & Portal
for(let i=sprites.length-1;i>=0;i--){
const s=sprites[i];
const d=Math.hypot(s.x-px,s.y-py);
if(s.kind==='pick'&&d<0.6){
if(s.ptype==='potion'){hp=Math.min(100,hp+35);sfx.potion();msg('Heiltrank (+35)','good')}
else if(s.ptype==='gold'){gold+=s.val;sfx.gold();msg('+'+s.val+' Gold')}
else if(s.ptype==='key'){keys++;sfx.key();msg('+1 Schlüssel','good')}
else if(s.ptype==='torch'){torchT=30;sfx.torchUp();msg('Die Fackel brennt heller!','good')}
sprites.splice(i,1);
}
if(s.kind==='portal'&&d<0.7)startLevelFade();
}
}

/* ================= RENDERING ================= */
const easeOut=t=>1-Math.pow(1-t,3);
function renderFrame(){
const horizon=clamp((VH>>1)+Math.round(bobPix),60,VH-60);
const halfH=VH*0.5;
const r0x=dirX-planeX,r0y=dirY-planeY,r1x=dirX+planeX,r1y=dirY+planeY;
// Boden & Decke
for(let y=0;y<VH;y++){
const isFloor=y>horizon,p=isFloor?y-horizon:horizon-y;
const o=y*VW;
if(p<=0){for(let x=0;x<VW;x++)buf32[o+x]=CEIL_SH[0][0];continue}
const rowDist=halfH/p;
let lvl=shadeIdx(rowDist,0);
const tArr=isFloor?FLOOR_SH[lvl]:CEIL_SH[clamp(lvl-4,0,NSH-1)];
const stepX=rowDist*(r1x-r0x)/VW,stepY=rowDist*(r1y-r0y)/VW;
let fx=px+rowDist*r0x,fy=py+rowDist*r0y;
for(let x=0;x<VW;x++){
const tx=((fx*TEX)|0)&63,ty=((fy*TEX)|0)&63;
buf32[o+x]=tArr[(ty<<6)+tx];
fx+=stepX;fy+=stepY;
}
}
// Wände (DDA)
for(let x=0;x<VW;x++){
const camX=2*x/VW-1;
const rdx=dirX+planeX*camX,rdy=dirY+planeY*camX;
let mapX=px|0,mapY=py|0;
const dltX=Math.abs(1/(rdx||1e-9)),dltY=Math.abs(1/(rdy||1e-9));
let stepX,sdx,stepY,sdy;
if(rdx<0){stepX=-1;sdx=(px-mapX)*dltX}else{stepX=1;sdx=(mapX+1-px)*dltX}
if(rdy<0){stepY=-1;sdy=(py-mapY)*dltY}else{stepY=1;sdy=(mapY+1-py)*dltY}
let side=0,hit=0,cellType=1,guard=0;
while(!hit&&guard++<80){
if(sdx<sdy){sdx+=dltX;mapX+=stepX;side=0}else{sdy+=dltY;mapY+=stepY;side=1}
if(mapX<0||mapY<0||mapX>=MW||mapY>=MH){hit=1;cellType=1;break}
const c=grid[mapY*MW+mapX];
if(c>0){cellType=c;hit=1}
}
let perp=side===0?sdx-dltX:sdy-dltY;
if(perp<0.02)perp=0.02;
zbuf[x]=perp;
const lineH=VH/perp;
let wallX=side===0?py+perp*rdy:px+perp*rdx;
wallX-=Math.floor(wallX);
let texX=(wallX*TEX)|0;
if((side===0&&rdx>0)||(side===1&&rdy<0))texX=TEX-1-texX;
let lvl=shadeIdx(perp,side?-2:0);
const topBase=horizon-lineH/2;
let shift=0;
const da=doorAnims.get(mapY*MW+mapX);
if(da!==undefined)shift=lineH*easeOut(da);
const y0=Math.max(0,Math.floor(topBase-shift)),y1=Math.min(VH,Math.ceil(topBase+lineH-shift));
const step=TEX/lineH;
let texPos=(y0-(topBase-shift))*step;
const tArr=SH[cellType][lvl];
for(let y=y0;y<y1;y++){
let ty=texPos|0;ty=clamp(ty,0,63);
buf32[y*VW+x]=tArr[(ty<<6)+texX];
texPos+=step;
}
}
ctx.putImageData(img,0,0);
renderSprites(horizon);
renderWeapon();
// Fackel-Glow
const g=ctx.createRadialGradient(VW*0.2,VH-30,10,VW*0.2,VH-30,240*torchPower);
g.addColorStop(0,`rgba(255,150,60,${0.16*flick})`);g.addColorStop(1,'rgba(255,150,60,0)');
ctx.fillStyle=g;ctx.fillRect(0,0,VW,VH);
ctx.fillStyle=`rgba(255,120,40,${0.028*flick})`;ctx.fillRect(0,0,VW,VH);
// Grain
ctx.globalAlpha=0.055;
ctx.drawImage(grainC,(Math.random()*64)|0,(Math.random()*64)|0,VW,VH,0,0,VW,VH);
ctx.globalAlpha=1;
}
/* --- Sprites --- */
const tmpC=document.createElement('canvas');tmpC.width=64;tmpC.height=64;
const tg=tmpC.getContext('2d');
function renderSprites(horizon){
const invDet=1/(planeX*dirY-dirX*planeY);
const list=[];
for(const s of sprites){
const rx=s.x-px,ry=s.y-py;
const ty=invDet*(-planeY*rx+planeX*ry);
if(ty<=0.14||ty>17)continue;
const tx=invDet*(dirY*rx-dirX*ry);
list.push({s,ty,tx});
}
list.sort((a,b)=>b.ty-a.ty);
for(const it of list){
const s=it.s,ty=it.ty;
let imgKey;
if(s.kind==='enemy')imgKey=IMGS[s.etype];
else if(s.kind==='torch')imgKey=IMGS.walltorch[((timeNow*8+s.phase)|0)%2];
else if(s.kind==='portal')imgKey=IMGS.portal;
else imgKey=IMGS[s.ptype];
let light=lightAt(ty);
const minL=s.kind==='portal'?0.55:(s.kind==='torch'||(s.kind==='enemy'&&s.etype==='wisp'))?0.4:0;
if(light<minL)light=minL;
if(light<0.03)continue;
// Temp-Canvas vorbereiten
tg.clearRect(0,0,64,64);
tg.drawImage(imgKey,0,0);
let dieA=0;
if(s.kind==='enemy'&&s.deadT>=0)dieA=Math.min(1,s.deadT/0.6);
if(dieA>0){tg.globalCompositeOperation='destination-in';tg.fillStyle=`rgba(0,0,0,${1-dieA})`;tg.fillRect(0,0,64,64);tg.globalCompositeOperation='source-over'}
const dark=clamp(1-light*1.25,0,0.96);
if(dark>0.02){tg.globalCompositeOperation='source-atop';tg.fillStyle=`rgba(6,7,12,${dark})`;tg.fillRect(0,0,64,64);tg.globalCompositeOperation='source-over'}
if(s.kind==='enemy'){
if(s.windup>0){tg.globalCompositeOperation='source-atop';tg.fillStyle='rgba(255,60,30,.32)';tg.fillRect(0,0,64,64);tg.globalCompositeOperation='source-over'}
if(s.flash>0){tg.globalCompositeOperation='source-atop';tg.fillStyle=`rgba(255,255,255,${Math.min(0.8,s.flash*5)})`;tg.fillRect(0,0,64,64);tg.globalCompositeOperation='source-over'}
}
const hFull=VH/ty;
let sc=s.kind==='enemy'?s.sc:(s.kind==='torch'?0.5:s.kind==='portal'?1.0:s.ptype==='key'?0.3:s.ptype==='gold'?0.3:s.ptype==='potion'?0.34:0.4);
let fl=s.kind==='enemy'?s.fl:(s.kind==='torch'?0.28:0);
if(s.kind==='enemy'&&s.etype==='wisp')fl+=Math.sin(timeNow*2.4+s.phase)*0.07;
const h=hFull*sc*(s.deadT>=0?1-dieA*0.6:1);
const w=h*(s.kind==='portal'?0.95:1);
let bottom=horizon+hFull*0.5-hFull*fl;
if(s.kind==='enemy'&&s.deadT<0)bottom+=Math.sin(timeNow*6+s.phase)*hFull*0.012;
const top=bottom-h;
const screenX=(VW/2)*(1+it.tx/ty);
const left=screenX-w/2;
const x0=Math.max(0,left|0),x1=Math.min(VW-1,(left+w)|0);
if(x1<=x0)continue;
const stepCols=w>140?2:1;
for(let cx=x0;cx<=x1;cx+=stepCols){
if(zbuf[cx]>ty){
const sxp=clamp(((cx-left)/w)*64,0,63);
ctx.drawImage(tmpC,sxp,0,Math.max(1,64*stepCols/w),64,cx,top,stepCols,h);
}
}
// Portal-Puls
if(s.kind==='portal'){
const pulse=0.25+0.2*Math.sin(timeNow*3);
ctx.globalCompositeOperation='lighter';ctx.globalAlpha=pulse*light;
for(let cx=x0;cx<=x1;cx+=3)if(zbuf[cx]>ty){const sxp=clamp(((cx-left)/w)*64,0,63);ctx.drawImage(tmpC,sxp,0,Math.max(1,64*3/w),64,cx,top,3,h)}
ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
}
// Lebensbalken
if(s.kind==='enemy'&&s.deadT<0&&s.hp<s.maxHp&&w>20&&light>0.12){
const bw=Math.min(46,w*0.8);
ctx.fillStyle='rgba(0,0,0,.7)';ctx.fillRect(screenX-bw/2-1,top-8,bw+2,5);
ctx.fillStyle='#c0392b';ctx.fillRect(screenX-bw/2,top-7,bw*(s.hp/s.maxHp),3);
}
}
}

const mv=Math.min(1,speedNow/3);
const bx=Math.sin(bobPhase)*7*mv,by=Math.abs(Math.cos(bobPhase))*5*mv;
const sway=Math.sin(timeNow*1.4)*2;
// Fackel (links)

ctx.save();
ctx.translate(fx,fy);ctx.rotate(-0.22);
ctx.fillStyle='#3d2c17';ctx.fillRect(-5,-58,10,70);
ctx.fillStyle='#241a0d';ctx.fillRect(-6,-46,12,7);ctx.fillRect(-6,-30,12,7);
ctx.fillStyle='#181410';ctx.beginPath();ctx.ellipse(0,16,10,12,0,0,7);ctx.fill();
ctx.restore();
const flx=fx+13,fly=fy-62,fs=1+0.12*Math.sin(timeNow*13)+0.06*Math.sin(timeNow*29);
ctx.save();
ctx.globalCompositeOperation='lighter';
const fg=ctx.createRadialGradient(flx,fly,2,flx,fly,42*fs);
fg.addColorStop(0,`rgba(255,190,90,${0.5*flick})`);fg.addColorStop(1,'rgba(255,120,30,0)');
ctx.fillStyle=fg;ctx.fillRect(flx-50,fly-50,100,100);
ctx.restore();
ctx.fillStyle='rgba(255,120,25,.92)';ctx.beginPath();ctx.ellipse(flx,fly,7*fs,(13+3*Math.sin(timeNow*17))*fs,0.1,0,7);ctx.fill();
ctx.fillStyle='#ffb347';ctx.beginPath();ctx.ellipse(flx,fly+2,4.2*fs,8*fs,0.1,0,7);ctx.fill();

// Schwert (rechts)

ctx.strokeStyle='rgba(30,34,40,.7)';ctx.lineWidth=1.6;
ctx.beginPath();ctx.moveTo(0,-36);ctx.lineTo(0,-148);ctx.stroke();
ctx.fillStyle='#8a6a2f';ctx.fillRect(-17,-32,34,8);
ctx.fillStyle='#3b2a1c';ctx.fillRect(-4.5,-24,9,27);
ctx.fillStyle='#241812';for(let i=0;i<4;i++)ctx.fillRect(-4.5,-22+i*6,9,2.4);
ctx.fillStyle='#a8843a';ctx.beginPath();ctx.arc(0,7,5.5,0,7);ctx.fill();
ctx.restore();

$('keyCt').textContent=keys;
$('goldCt').textContent=gold;

frame.classList.toggle('dying',hp>0&&hp<25&&state==='play');

}
cctx.fillStyle='rgba(255,220,150,.9)';
cctx.beginPath();cctx.moveTo(120,26);cctx.lineTo(116,30);cctx.lineTo(124,30);cctx.closePath();cctx.fill();
// Minimap
mctx.fillStyle='#0a0c10';mctx.fillRect(0,0,136,136);
const sc=136/MW;
for(let y=0;y<MH;y++)for(let x=0;x<MW;x++){

else if(c===0)col='#20242e';
else if(c===4)col='#8a6a3a';
else if(c===5)col='#d9a83e';
else col='#414859';

mctx.fillRect(x*sc,y*sc,sc+0.4,sc+0.4);
}
for(const s of sprites)if(s.kind==='enemy'&&s.deadT<0&&Math.hypot(s.x-px,s.y-py)<8){
mctx.fillStyle=`rgba(220,60,40,${0.6+0.4*Math.sin(timeNow*6)})`;
mctx.fillRect(s.x*sc-1.5,s.y*sc-1.5,3,3);
}
mctx.save();
mctx.translate(px*sc,py*sc);mctx.rotate(ang);
mctx.fillStyle='#f0d68a';
mctx.beginPath();mctx.moveTo(5,0);mctx.lineTo(-3.5,-3.2);mctx.lineTo(-3.5,3.2);mctx.closePath();mctx.fill();
mctx.restore();
}

$('btnStart').onclick=()=>{initAudio();newRun();requestLock()};
}
function showPause(){
overlay.classList.remove('hidden');
overlay.innerHTML=`<div style="text-align:center"><div class="pauseTxt">PAUSIERT</div><div class="pauseSub">Klicke, um weiterzugehen</div></div>`;
overlay.onclick=()=>{overlay.onclick=null;paused=false;overlay.classList.add('hidden');requestLock()};
}
function showDeath(){
overlay.classList.remove('hidden');
overlay.innerHTML=`
<div class="card">
<h1 class="dead">GEFALLEN</h1>
<div class="sub">Die Gruft zählt einen weiteren Namen.</div>
<div class="stats">
<div>EBENE<b>${roman(depth)}</b></div>
<div>GOLD<b>${gold}</b></div>
<div>KILLS<b>${kills}</b></div>
</div>
<button class="go" id="btnRetry">NEUER ABSTIEG</button>
</div>`;
$('btnRetry').onclick=()=>{newRun();requestLock()};
}
function requestLock(){try{cv.requestPointerLock()}catch(e){}}
function newRun(){
seedBase=(Math.random()*1e9)|0;depth=1;hp=100;gold=0;keys=0;kills=0;torchT=0;deadT=0;
genLevel(1);
state='play';paused=false;fadeA=0;fadeDir=0;
$('fade').style.opacity=0;$('fade').classList.remove('blood');
overlay.classList.add('hidden');
showLevelCard();
msg('Finde die leuchtende Treppe in die Tiefe.');
}

/* ================= HAUPTSCHLEIFE ================= */
let lastT=performance.now();
function loop(now){
requestAnimationFrame(loop);
let dt=Math.min(0.05,(now-lastT)/1000);lastT=now;
if(hitStop>0){hitStop-=dt;dt=0}
if(!paused)update(dt);
if(state==='title'){
dirX=Math.cos(ang);dirY=Math.sin(ang);planeX=-dirY*FOV;planeY=dirX*FOV;
flick=0.93+0.045*Math.sin(timeNow*9.7);timeNow+=0;
}
if(state==='fade'){
fadeA+=fadeDir*dt*1.7;
if(fadeDir>0&&fadeA>=1){
fadeA=1;depth++;genLevel(depth);hp=Math.min(100,hp+20);
showLevelCard();fadeDir=-1;
}else if(fadeDir<0&&fadeA<=0){fadeA=0;fadeDir=0;state='play'}
$('fade').style.opacity=fadeA;
}
if(state==='dead'){
deadT+=dt;fadeA=Math.min(1,deadT/1.2);
$('fade').classList.add('blood');
$('fade').style.opacity=fadeA;
if(deadT>1.25&&overlay.classList.contains('hidden')===false){}
if(deadT>1.25&&!overlay.dataset.shown){overlay.dataset.shown='1';showDeath()}
}else{delete overlay.dataset.shown}
if(shakeMag>0){
shakeMag*=Math.pow(0.001,dt);if(shakeMag<0.1)shakeMag=0;
cv.style.transform=`translate(${(Math.random()-0.5)*shakeMag}px,${(Math.random()-0.5)*shakeMag}px)`;
}else cv.style.transform='';
dirX=Math.cos(ang);dirY=Math.sin(ang);planeX=-dirY*FOV;planeY=dirX*FOV;
renderFrame();
updateHUD();
}
/* Boot */
genLevel(1);
showTitle();
requestAnimationFrame(loop);
</script>
</body>
</html>
